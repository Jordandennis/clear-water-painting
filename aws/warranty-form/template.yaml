AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Warranty request form - API Gateway -> Lambda -> SES

Parameters:
  FromAddress:
    Type: String
    Description: Verified SES sender address (e.g. noreply@clearwaterpainting.ca)
  ToAddress:
    Type: String
    Description: Where warranty requests are delivered
  AllowedOrigin:
    Type: String
    Description: Site origin allowed to call this API (e.g. https://clearwaterpainting.ca)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]

Resources:
  WarrantyFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Environment:
        Variables:
          FROM_ADDRESS: !Ref FromAddress
          TO_ADDRESS: !Ref ToAddress
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref WarrantyFormApi
            Path: /warranty
            Method: POST
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref WarrantyFormApi
            Path: /warranty
            Method: OPTIONS

  WarrantyFormApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]

Outputs:
  ApiEndpoint:
    Description: POST warranty submissions to this URL
    Value: !Sub https://${WarrantyFormApi}.execute-api.${AWS::Region}.amazonaws.com/warranty
